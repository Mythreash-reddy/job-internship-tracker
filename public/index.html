<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Job & Internship Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header>

        <h1>
            Job & Internship Tracker
        </h1>

        <p>
            Keep track of your applications in one place.
        </p>

    </header>


    <main>


        <!-- =================================
             DASHBOARD
        ================================== -->

        <section class="dashboard">

            <h2>
                Application Dashboard
            </h2>


            <div class="stats">


                <div class="stat-card">

                    <h3>
                        Total
                    </h3>

                    <p id="totalCount">
                        0
                    </p>

                </div>


                <div class="stat-card">

                    <h3>
                        Applied
                    </h3>

                    <p id="appliedCount">
                        0
                    </p>

                </div>


                <div class="stat-card">

                    <h3>
                        Interview
                    </h3>

                    <p id="interviewCount">
                        0
                    </p>

                </div>


                <div class="stat-card">

                    <h3>
                        Offer
                    </h3>

                    <p id="offerCount">
                        0
                    </p>

                </div>


                <div class="stat-card">

                    <h3>
                        Rejected
                    </h3>

                    <p id="rejectedCount">
                        0
                    </p>

                </div>


            </div>

        </section>


        <!-- =================================
             ADD / EDIT APPLICATION
        ================================== -->

        <section class="application-form">

            <h2 id="formTitle">
                Add Application
            </h2>


            <form id="applicationForm">


                <input
                    type="text"
                    id="company"
                    placeholder="Company"
                    required
                >


                <input
                    type="text"
                    id="role"
                    placeholder="Job / Internship Role"
                    required
                >


                <select id="status">

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Offer">
                        Offer
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>


                <input
                    type="date"
                    id="deadline"
                >


                <button
                    type="submit"
                    id="submitButton"
                >
                    Add Application
                </button>


                <button
                    type="button"
                    id="cancelButton"
                    style="display: none;"
                >
                    Cancel Edit
                </button>


            </form>

        </section>


        <!-- =================================
             APPLICATIONS
        ================================== -->

        <section class="applications">

            <h2>
                My Applications
            </h2>


            <!-- SEARCH + FILTER -->

            <div class="filters">


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by company or role..."
                >


                <select id="filterStatus">

                    <option value="All">
                        All Statuses
                    </option>

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Offer">
                        Offer
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>


            </div>


            <!-- APPLICATION LIST -->

            <div id="applicationList">

                <!-- Applications appear here -->

            </div>


        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
